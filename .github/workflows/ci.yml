name: WOW quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Integrity, assets, types, lint and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check technical repository and app configuration
        run: node scripts/test-repository-integrity.cjs
      - name: Validate browser test script syntax
        run: |
          node --check scripts/test-admin-browser-playwright.cjs
          node --check scripts/test-customer-web-deeplinks-playwright.cjs
          node --check scripts/test-merchant-live-auth-playwright.cjs
          node --check scripts/test-stage4-offer-scope-staging.cjs
      - name: Verify approved brand/illustration asset hashes
        run: node scripts/test-design-foundation.cjs
      - name: Verify stage 4 UI navigation, OAuth errors and responsive shell
        run: node scripts/test-stage4-ui-foundations.cjs
      - name: TypeScript, lint, UI, Query and integration guards
        run: bash scripts/verify-ui-v08.sh
  customer-web-deep-links:
    name: Customer Expo web deep links and onboarding guest safety
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      # Public Development credentials; never expose a service role or user token.
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cG9saXNoZWQtYmFzaWxpc2stNzExNC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_SUPABASE_URL: https://jfqmdnffqwkqevdhmtfi.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_pgfkQko0jzdH9WJKj4geMQ_9Nnibz0K
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Export Customer development web SPA
        run: pnpm --filter customer exec expo export -p web --dev --output-dir "$RUNNER_TEMP/wow-customer-web-dev"
      - name: Real Customer unknown-ID deep links respect guest onboarding
        env:
          WOW_CUSTOMER_WEB_EXPORT_DIR: ${{ runner.temp }}/wow-customer-web-dev
        run: node scripts/test-customer-web-deeplinks-playwright.cjs
      - name: Export Customer production web SPA
        run: pnpm --filter customer exec expo export -p web --output-dir "$RUNNER_TEMP/wow-customer-web-prod"
      - name: Production-like deep links reject forged preview requests
        env:
          WOW_CUSTOMER_WEB_EXPORT_DIR: ${{ runner.temp }}/wow-customer-web-prod
        run: node scripts/test-customer-web-deeplinks-playwright.cjs

  merchant-web-guest:
    name: Merchant Expo web export and browser guest smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      # Public development credentials; no secret/session is exposed to the app.
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cG9saXNoZWQtYmFzaWxpc2stNzExNC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_SUPABASE_URL: https://jfqmdnffqwkqevdhmtfi.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_pgfkQko0jzdH9WJKj4geMQ_9Nnibz0K
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Export actual merchant Expo web application
        run: pnpm --filter merchant exec expo export -p web --dev --output-dir "$RUNNER_TEMP/wow-merchant-web"
      - name: Exercise real guest routes in Chromium
        env:
          WOW_MERCHANT_WEB_EXPORT_DIR: ${{ runner.temp }}/wow-merchant-web
        run: node scripts/test-merchant-guest-playwright.cjs
      - name: Exercise all offer editing routes (MER-05-01 through MER-06) in Chromium
        env:
          WOW_MERCHANT_WEB_EXPORT_DIR: ${{ runner.temp }}/wow-merchant-web
        run: node scripts/test-merchant-batch-02-playwright.cjs
      - name: Exercise final 8 merchant routes and capture actual browser screenshots
        env:
          WOW_MERCHANT_WEB_EXPORT_DIR: ${{ runner.temp }}/wow-merchant-web
        run: node scripts/test-merchant-final-8-playwright.cjs
      - name: Archive final 8 screenshots (development preview only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-final8-screenshots-${{ github.sha }}
          path: |
            rendered_screenshots/*.png
            rendered_screenshots_scroll/*.png
            rendered_screenshots_dark/*.png
            rendered_screenshots_previous13/*.png
            WOW_MERCHANT_FINAL_8_RENDERED_SCREENSHOTS.zip
          if-no-files-found: warn
          retention-days: 7

  merchant-live-clerk-auth:
    name: Real Clerk OTP and Supabase profile RLS (development only)
    needs: verify
    # Run real Clerk OTP + Supabase RLS for trusted merchant PRs and the W06 review PR.
    # No hard-coded PR numbers: future merchant batches must be tested too.
    # Only same-repository PRs can use the dedicated development test identities.
    # Existing fixture only; no new business or branch is created; no elevated admin identity.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'feat/merchant-') || (github.head_ref == 'feat/admin-w06-main-sync-review-20261114' || github.head_ref == 'feat/admin-w07-offer-review-categories-20261115'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cG9saXNoZWQtYmFzaWxpc2stNzExNC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_SUPABASE_URL: https://jfqmdnffqwkqevdhmtfi.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_pgfkQko0jzdH9WJKj4geMQ_9Nnibz0K
      WOW_E2E_ALLOW_FIXTURE_CREATION: 'false'
      WOW_E2E_EXPECT_ADMIN_REVIEWER: 'false' # No standing reviewer grants; optional W07 QA is explicit.
      WOW_E2E_STORAGE_VERIFICATION: 'false' # Private evidence test requires explicit scoped cleanup setup.
      WOW_E2E_CAPTURE_ADMIN_VIEWS: 'false'
      WOW_E2E_CAPTURE_W07: 'false' # Require separately prepared temporary role for authenticated screenshots.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Export real merchant web application
        run: pnpm --filter merchant exec expo export -p web --dev --output-dir "$RUNNER_TEMP/wow-merchant-web"
      - name: Export real Admin web application for W06 live Clerk review
        if: env.WOW_E2E_CAPTURE_ADMIN_VIEWS == 'true' || env.WOW_E2E_CAPTURE_W07 == 'true'
        run: pnpm --filter admin exec expo export -p web --dev --output-dir "$RUNNER_TEMP/wow-admin-web"
      - name: Verify real Clerk sessions, Supabase RLS, and W06 reviewer UI
        run: WOW_MERCHANT_WEB_EXPORT_DIR="$RUNNER_TEMP/wow-merchant-web" WOW_ADMIN_WEB_EXPORT_DIR="$RUNNER_TEMP/wow-admin-web" node scripts/test-merchant-live-auth-playwright.cjs
      - name: Archive W07 real Clerk screenshots
        if: always() && env.WOW_E2E_CAPTURE_W07 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: admin-w07-real-clerk-screenshots
          path: artifacts/admin-w07-real-clerk-screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Archive W06 signed-session screenshots
        if: always() && env.WOW_E2E_EXPECT_ADMIN_REVIEWER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: admin-w06-real-clerk-screenshots
          path: artifacts/admin-w06-real-clerk-screenshots/
          if-no-files-found: warn
          retention-days: 7
  merchant-production-preview:
    name: Production Expo web rejects crafted preview guest links
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cG9saXNoZWQtYmFzaWxpc2stNzExNC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_SUPABASE_URL: https://jfqmdnffqwkqevdhmtfi.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_pgfkQko0jzdH9WJKj4geMQ_9Nnibz0K
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Export real production-mode merchant web build
        run: pnpm --filter merchant exec expo export -p web --output-dir "$RUNNER_TEMP/wow-merchant-production"
      - name: Ensure production guests never bypass authorization via preview URLs
        env:
          WOW_MERCHANT_WEB_EXPORT_DIR: ${{ runner.temp }}/wow-merchant-production
          WOW_EXPECT_PRODUCTION_PREVIEW_DENIED: '1'
        run: node scripts/test-merchant-guest-playwright.cjs

  merchant-native-bundles:
    name: Merchant iOS and Android production JS export
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cG9saXNoZWQtYmFzaWxpc2stNzExNC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_SUPABASE_URL: https://jfqmdnffqwkqevdhmtfi.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_pgfkQko0jzdH9WJKj4geMQ_9Nnibz0K
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Export Android bundle
        run: pnpm --filter merchant exec expo export --platform android --output-dir "$RUNNER_TEMP/wow-merchant-android"
      - name: Export iOS bundle
        run: pnpm --filter merchant exec expo export --platform ios --output-dir "$RUNNER_TEMP/wow-merchant-ios"

  lockfile-pnpm12:
    name: Frozen lockfile install with pnpm 12
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify and install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

  admin-web-access:
    name: Admin Expo Web hydration and production guest access gate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      # Public development credentials, never a service-role key.
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cG9saXNoZWQtYmFzaWxpc2stNzExNC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_SUPABASE_URL: https://jfqmdnffqwkqevdhmtfi.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_pgfkQko0jzdH9WJKj4geMQ_9Nnibz0K
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check Admin dev browser harness syntax
        run: |
          bash -n scripts/test-admin-live-dev-server.sh
          node --check scripts/test-admin-browser-playwright.cjs
          node --check scripts/capture-admin-batch01-screenshots.cjs
      - name: Verify development Admin routes and capture screenshots on live Expo Metro
        run: bash scripts/test-admin-live-dev-server.sh
      - name: Upload Admin visual-review screenshots and manifest
        uses: actions/upload-artifact@v4
        with:
          name: admin-batch01-visual-review
          path: artifacts/admin-batch01-review/
          if-no-files-found: error
          retention-days: 14
      - name: Export production Admin Expo Web
        run: pnpm --filter admin exec expo export -p web --output-dir "$RUNNER_TEMP/wow-admin-prod"
      - name: Verify production preview URLs cannot unlock Admin routes
        env:
          WOW_ADMIN_WEB_EXPORT_DIR: ${{ runner.temp }}/wow-admin-prod
          WOW_EXPECT_PRODUCTION_PREVIEW_DENIED: '1'
        run: node scripts/test-admin-browser-playwright.cjs

  customer-admin-native-bundles:
    name: Customer and Admin Android/iOS production JS exports
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      # Public development configuration for bundle validation, not release credentials.
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cG9saXNoZWQtYmFzaWxpc2stNzExNC5jbGVyay5hY2NvdW50cy5kZXYk
      EXPO_PUBLIC_SUPABASE_URL: https://jfqmdnffqwkqevdhmtfi.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_pgfkQko0jzdH9WJKj4geMQ_9Nnibz0K
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Export customer Android JavaScript bundle
        run: pnpm --filter customer exec expo export --platform android --output-dir "$RUNNER_TEMP/wow-customer-android"
      - name: Export customer iOS JavaScript bundle
        run: pnpm --filter customer exec expo export --platform ios --output-dir "$RUNNER_TEMP/wow-customer-ios"
      - name: Export admin Android JavaScript bundle
        run: pnpm --filter admin exec expo export --platform android --output-dir "$RUNNER_TEMP/wow-admin-android"
      - name: Export admin iOS JavaScript bundle
        run: pnpm --filter admin exec expo export --platform ios --output-dir "$RUNNER_TEMP/wow-admin-ios"
